[package]
name = "justtools-core"
version = "2.0.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
description = "Pure-Rust document and utility engines for JustTools"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive", "wrap_help"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
lightningcss = { version = "=1.0.0-alpha.71", default-features = false, features = ["visitor"] }
lopdf = { version = "0.44.0", default-features = false }
netstat2 = "0.11.2"
oxvg_ast = { version = "0.0.6", default-features = false, features = ["roxmltree", "serialize", "visitor"] }
oxvg_optimiser = "0.0.6"
parcel_selectors = "=0.28.2"
qrcode = { version = "0.14.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sysinfo = { version = "=0.37.2", default-features = false, features = ["system"] }
tempfile = "3.27.0"
walkdir = "2.5.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
