name: Native builds

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msrv:
    name: Rust 1.90 minimum
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install declared minimum Rust
        run: rustup toolchain install 1.90.0 --profile minimal --no-self-update
      - name: Check the complete workspace at MSRV
        run: cargo +1.90.0 check --locked --workspace --all-targets

  build:
    name: ${{ matrix.name }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            artifact: justtools-windows-x64
            executable: just.exe
            archive: zip
          - name: Windows ARM64
            os: windows-11-arm
            artifact: justtools-windows-arm64
            executable: just.exe
            archive: zip
          - name: Linux x64 (glibc 2.35 baseline)
            os: ubuntu-22.04
            artifact: justtools-linux-x64
            executable: just
            archive: tar.gz
          - name: Linux ARM64 (glibc 2.35 baseline)
            os: ubuntu-22.04-arm
            artifact: justtools-linux-arm64
            executable: just
            archive: tar.gz
          - name: macOS Apple Silicon
            os: macos-15
            artifact: justtools-macos-arm64
            executable: just
            archive: tar.gz
          - name: macOS Intel
            os: macos-15-intel
            artifact: justtools-macos-x64
            executable: just
            archive: tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Use stable Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint every target
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test every target
        run: cargo test --locked --workspace --all-targets

      - name: Build release executable
        run: cargo build --locked --release -p justtools

      - name: Package Windows artifact
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $stage = "dist/${{ matrix.artifact }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/release/${{ matrix.executable }}", README.md, LICENSE, THIRD_PARTY_LICENSES.md -Destination $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/${{ matrix.artifact }}.zip"

      - name: Package Unix artifact with executable mode
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          stage="dist/${{ matrix.artifact }}"
          mkdir -p "$stage"
          install -m 0755 "target/release/${{ matrix.executable }}" "$stage/just"
          install -m 0644 README.md LICENSE THIRD_PARTY_LICENSES.md "$stage/"
          tar -czf "dist/${{ matrix.artifact }}.tar.gz" -C "$stage" .

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - msrv
      - build
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Verify version tag
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          expected="v${version}"
          if [[ "$GITHUB_REF_NAME" != "$expected" ]]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match Cargo.toml version $expected"
            exit 1
          fi

      - name: Download native archives
        uses: actions/download-artifact@v8
        with:
          pattern: justtools-*
          path: dist
          merge-multiple: true

      - name: Verify release archives
        shell: bash
        run: |
          expected=(
            justtools-windows-x64.zip
            justtools-windows-arm64.zip
            justtools-linux-x64.tar.gz
            justtools-linux-arm64.tar.gz
            justtools-macos-arm64.tar.gz
            justtools-macos-x64.tar.gz
          )
          for archive in "${expected[@]}"; do
            if [[ ! -s "dist/$archive" ]]; then
              echo "::error::Missing or empty release archive: $archive"
              exit 1
            fi
          done

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="JustTools $GITHUB_REF_NAME"
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease+=(--prerelease)
          fi

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "$title" \
              "${prerelease[@]}"
          fi
