[package]
name = "justtools"
version = "2.8.0"
edition = "2024"
rust-version = "1.90"
description = "Fast, opinionated, cross-platform just* command-line tools"
license = "MIT"

[workspace]
members = ["explorer/menu", "explorer/shell", "ports/core-tools"]
default-members = ["."]
resolver = "3"

[[bin]]
name = "just"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
atomic-write-file = "0.3"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ctrlc = "3.4"
crossterm = "0.29"
dialoguer = { version = "0.11", default-features = false }
directories = "6.0"
flate2 = "1.1"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "pnm", "qoi", "tiff", "webp"] }
ignore = "0.4.24"
jpeg-encoder = "0.7.1"
justtools-core = { path = "ports/core-tools" }
justtools-menu = { path = "explorer/menu" }
netstat2 = "0.11.2"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["api-22", "coreml", "cuda", "directml", "load-dynamic", "std"] }
rayon = "1.10"
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
sysinfo = "=0.37.2"
tar = "0.4"
tempfile = "3.20"
thiserror = "2.0"
toml = "0.9"
ureq = "3.3"
walkdir = "2.5"
webp = { version = "0.3.1", default-features = false }
zip = { version = "4.3", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_System_SystemServices", "Win32_System_Console", "Win32_Security", "Win32_System_DataExchange", "Win32_System_Memory"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.55"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.61", features = ["Win32_System_JobObjects"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
